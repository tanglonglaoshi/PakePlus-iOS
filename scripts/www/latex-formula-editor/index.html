<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Formula Library</title>

<!-- KaTeX -->
<link rel="stylesheet" href="./katex/katex.min.css">
<script src="./katex/katex.min.js"></script>

<!-- MathJax -->
<script>

    loader: { load: ['[tex]/all-packages'] },
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],

    }
  };
</script>
<script>localStorage.removeItem("MathJax-Menu-Settings");</script>
<script defer src="./MathJax-3.2.2/es5/tex-mml-chtml.js"></script>

<style>
  /* =========================================================================
   *  科幻主题
   * ========================================================================= */
  :root {
    --pb-bg-0:      #060a14;
    --pb-bg-1:      #0a1220;
    --pb-bg-2:      #101a30;
    --pb-accent:    #22d3ee;
    --pb-accent-2:  #a855f7;
    --pb-accent-3:  #38bdf8;
    --pb-accent-glow: rgba(34,211,238,.45);
    --pb-text:      #c9e4f5;
    --pb-text-dim:  #6b87a8;
    --pb-text-faint:#3d5166;
    --pb-border:    rgba(34,211,238,.20);
    --pb-border-2:  rgba(34,211,238,.42);
  }

  html { background: var(--pb-bg-0) !important; height: 100%; }
  body {
    margin: 0 !important;
    padding: 14px 18px 24px 72px !important; /* 左侧留出 72px 给侧边栏 */
    background: var(--pb-bg-0) !important;
    color: var(--pb-text) !important;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif !important;
    font-size: 13px;
    min-height: 100vh;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 左侧窄边栏 ===== */
  .pb-sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 56px;
    background: linear-gradient(180deg, rgba(10,18,32,.92), rgba(6,10,20,.98)) !important;
    border-right: 1px solid var(--pb-border) !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    z-index: 100;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    box-shadow: 2px 0 20px rgba(0,0,0,.3);
  }
  .pb-side-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: rgba(34,211,238,.04);
    color: var(--pb-text-dim);
    cursor: pointer;
    display: grid; place-items: center;
    transition: all .2s;
    margin-bottom: 8px;
    flex: none;
  }
  .pb-side-btn svg { width: 20px; height: 20px; }
  .pb-side-btn:hover {
    background: rgba(34,211,238,.12);
    border-color: var(--pb-border-2);
    color: var(--pb-accent);
    box-shadow: 0 0 12px rgba(34,211,238,.2);
  }
  .pb-side-btn.active {
    background: linear-gradient(135deg, rgba(34,211,238,.28), rgba(168,85,247,.22));
    border-color: var(--pb-accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(34,211,238,.4);
  }
  .pb-side-divider {
    width: 24px;
    height: 1px;
    background: var(--pb-border);
    margin: 8px 0 16px;
    flex: none;
  }
  /* 竖排提示文字 */
  .pb-hint-vertical {
    margin-top: auto;
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-size: 11px;
    color: var(--pb-text-dim);
    letter-spacing: 4px;
    padding-bottom: 12px;
    white-space: nowrap;
    flex: none;
  }
  
  /* 引擎选择弹窗 */
  .pb-popover-menu {
    position: fixed;
    left: 64px;
    top: 120px;
    background: linear-gradient(135deg, rgba(10,18,32,.98), rgba(16,26,48,.98));
    border: 1px solid var(--pb-accent);
    border-radius: 10px;
    padding: 6px;
    z-index: 1000;
    display: none;
    flex-direction: column;
    gap: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,.6), 0 0 15px rgba(34,211,238,.2);
    animation: pbPopIn .15s cubic-bezier(.34,1.3,.64,1);
  }
  .pb-popover-menu.show { display: flex; }
  .pb-popover-item {
    padding: 8px 14px;
    font-size: 12px;
    color: var(--pb-text-dim);
    border-radius: 6px;
    cursor: pointer;
    font-family: ui-monospace, monospace;
    white-space: nowrap;
    transition: all .15s;
  }
  .pb-popover-item:hover {
    background: rgba(34,211,238,.12);
    color: var(--pb-accent);
  }
  .pb-popover-item.active {
    background: rgba(34,211,238,.2);
    color: #fff;
  }

  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 70% 50% at 20% 0%, rgba(34,211,238,.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 100%, rgba(168,85,247,.10), transparent 60%),
      linear-gradient(180deg, transparent 0, rgba(34,211,238,.015) 50%, transparent 100%),
      repeating-linear-gradient(0deg, transparent 0 28px, rgba(34,211,238,.028) 28px 29px),
      repeating-linear-gradient(90deg, transparent 0 28px, rgba(34,211,238,.028) 28px 29px);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: linear-gradient(180deg, transparent 0%, transparent 48%, rgba(34,211,238,.05) 49.5%, transparent 51%, transparent 100%);
    background-size: 100% 200%; animation: pbScan 8s linear infinite; opacity: .6;
  }
  @keyframes pbScan { 0% { background-position: 0 -100%; } 100% { background-position: 0 100%; } }

  .pb-shell, body > *:not(style):not(script) { position: relative; z-index: 1; }

  /* 顶栏 */
  .pb-topbar {
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 16px; margin-bottom: 16px;
    background: linear-gradient(135deg, rgba(10,18,32,.92), rgba(16,26,48,.88)) !important;
    border: 1px solid var(--pb-border) !important; border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(34,211,238,.06) inset, 0 0 30px rgba(34,211,238,.08), 0 4px 16px rgba(0,0,0,.35);
    backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4);
  }
  .pb-topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }

  .pb-select {
    height: 32px !important; padding: 0 30px 0 12px !important;
    background: rgba(10,18,32,.8) !important; border: 1px solid var(--pb-border) !important;
    border-radius: 8px !important; color: var(--pb-text) !important;
    font-family: ui-monospace, monospace !important; font-size: 11.5px !important;
    cursor: pointer !important; outline: none !important; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--pb-accent) 50%), linear-gradient(135deg, var(--pb-accent) 50%, transparent 50%) !important;
    background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px !important;
    background-size: 5px 5px, 5px 5px !important; background-repeat: no-repeat !important;
    transition: border-color .15s, box-shadow .15s;
  }
  .pb-select:hover, .pb-select:focus { border-color: var(--pb-accent) !important; box-shadow: 0 0 12px rgba(34,211,238,.3); }
  .pb-select option { background: #0a1220 !important; color: var(--pb-text) !important; }

  .pb-topbtn {
    height: 32px !important; padding: 0 14px !important;
    background: rgba(10,18,32,.8) !important; border: 1px solid var(--pb-border) !important;
    border-radius: 8px !important; color: var(--pb-text) !important;
    font-family: inherit !important; font-size: 12px !important; font-weight: 600 !important; letter-spacing: .5px;
    cursor: pointer !important; display: inline-flex !important; align-items: center; gap: 6px;
    transition: all .18s;
  }
  .pb-topbtn svg { width: 13px; height: 13px; }
  .pb-topbtn:hover { background: rgba(34,211,238,.10) !important; border-color: var(--pb-accent) !important; color: var(--pb-accent) !important; box-shadow: 0 0 16px rgba(34,211,238,.35); }
  .pb-topbtn.active {
    background: linear-gradient(135deg, rgba(34,211,238,.28), rgba(168,85,247,.22)) !important;
    border-color: var(--pb-accent) !important; color: #fff !important;
    box-shadow: 0 0 0 1px rgba(34,211,238,.5) inset, 0 0 20px rgba(34,211,238,.55), 0 0 40px rgba(168,85,247,.25);
  }

  .pb-checkbox {
    display: inline-flex !important; align-items: center; gap: 6px; height: 32px !important; padding: 0 12px !important;
    background: rgba(10,18,32,.5) !important; border: 1px solid var(--pb-border) !important;
    border-radius: 8px !important; color: var(--pb-text) !important; font-size: 12px !important;
    cursor: pointer !important; transition: border-color .15s; user-select: none;
  }
  .pb-checkbox:hover { border-color: var(--pb-border-2) !important; }
  .pb-checkbox input[type=checkbox] { margin: 0 !important; width: 14px; height: 14px; accent-color: var(--pb-accent); cursor: pointer; }

  .pb-hint {
    font-family: ui-monospace, monospace; font-size: 11px; color: var(--pb-text-dim); letter-spacing: .6px;
    flex-basis: 100%; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .pb-hint::before { content: '▸'; color: var(--pb-accent); text-shadow: 0 0 8px var(--pb-accent-glow); }

  /* 分组 section */
  .pb-section {
    margin-bottom: 14px; padding: 12px 14px;
    background: linear-gradient(135deg, rgba(10,18,32,.55), rgba(16,26,48,.5)) !important;
    border: 1px solid rgba(34,211,238,.10) !important; border-radius: 10px;
  }
  .pb-section-title {
    display: flex; align-items: center; gap: 8px;
    font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 2px; color: var(--pb-text-dim); text-transform: uppercase; margin-bottom: 10px;
  }
  .pb-section-title::before { content: ''; width: 3px; height: 12px; border-radius: 2px; background: linear-gradient(180deg, var(--pb-accent), var(--pb-accent-2)); box-shadow: 0 0 10px var(--pb-accent-glow); }
  .pb-section-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(34,211,238,.30), transparent); }

  .pb-btn-row { display: flex; flex-wrap: wrap; gap: 14px 12px; min-height: 32px; }

  /* 抽屉包装器 & 按钮 */
  .pb-group-wrap { position: relative; display: inline-block; transition: transform .12s; }
  .pb-group-wrap > .pb-group-btn {
    padding: 6px 10px !important; min-width: 24px; min-height: 32px;
    display: flex !important; align-items: center !important; justify-content: center !important;
    background: linear-gradient(135deg, rgba(10,18,32,.85), rgba(16,26,48,.85)) !important;
    border: 1px solid var(--pb-border) !important; border-radius: 9px !important;
    color: var(--pb-text) !important; font-family: inherit !important; cursor: pointer !important;
    box-shadow: 0 0 0 1px rgba(34,211,238,.04) inset, 0 2px 8px rgba(0,0,0,.3);
    transition: all .18s cubic-bezier(.34,1.2,.64,1); overflow: hidden; position: relative;
  }
  .pb-group-wrap > .pb-group-btn::before { content: ''; position: absolute; inset: 0; border-radius: 8px; background: linear-gradient(135deg, transparent 60%, rgba(34,211,238,.06) 100%); pointer-events: none; }
  .pb-group-wrap.is-custom > .pb-group-btn { border-style: dashed !important; border-color: rgba(168,85,247,.42) !important; }
  .pb-group-wrap:hover > .pb-group-btn {
    border-color: var(--pb-accent) !important; color: var(--pb-accent) !important;
    box-shadow: 0 0 0 1px rgba(34,211,238,.22) inset, 0 0 18px rgba(34,211,238,.35), 0 4px 14px rgba(0,0,0,.35);
    transform: translateY(-1px);
  }
  .pb-group-wrap.in-manager > .pb-group-btn { cursor: grab !important; border-style: dashed !important; }
  .pb-group-wrap.in-manager > .pb-group-btn:active { cursor: grabbing !important; }
  .pb-group-wrap.dragging { opacity: .3; transform: scale(.92); filter: grayscale(.6); outline: 1px dashed rgba(34,211,238,.5); outline-offset: 2px; }
  .pb-group-wrap.is-hidden > .pb-group-btn { opacity: .38; filter: grayscale(.9); }
  .pb-group-wrap.is-hidden:hover > .pb-group-btn { opacity: .75; }

  /* 拖拽落点 */
  .pb-group-wrap.drag-over-left > .pb-group-btn, .pb-group-wrap.drag-over-right > .pb-group-btn {
    border-color: var(--pb-accent) !important; background: linear-gradient(135deg, rgba(34,211,238,.20), rgba(168,85,247,.14)) !important;
    box-shadow: 0 0 0 1px rgba(34,211,238,.45) inset, 0 0 18px rgba(34,211,238,.45) !important; transform: translateY(-1px);
  }
  .pb-group-wrap.drag-over-left, .pb-group-wrap.drag-over-right { z-index: 20; }
  .pb-group-wrap.drag-over-left::after, .pb-group-wrap.drag-over-right::after {
    content: ''; position: absolute; top: -7px; bottom: -7px; width: 4px; border-radius: 3px;
    background: var(--pb-accent); box-shadow: 0 0 8px var(--pb-accent), 0 0 18px rgba(34,211,238,.9), 0 0 30px rgba(34,211,238,.5);
    pointer-events: none; z-index: 21; animation: pbDropPulse .75s ease-in-out infinite;
  }
  .pb-group-wrap.drag-over-left::after { left: -9px; }
  .pb-group-wrap.drag-over-right::after { right: -9px; }
  @keyframes pbDropPulse { 0%, 100% { opacity: .6; transform: scaleY(.82); } 50% { opacity: 1; transform: scaleY(1); } }

  .pb-group-badges {
    position: absolute; top: -8px; right: -8px; display: flex; gap: 3px; z-index: 5;
    opacity: 0; transform: scale(.85); transition: opacity .15s, transform .15s;
  }
  .pb-group-wrap.in-manager .pb-group-badges, .pb-group-wrap.in-manager:hover .pb-group-badges { opacity: 1; transform: scale(1); }
  .pb-group-badge {
    width: 20px !important; height: 20px !important; padding: 0 !important; margin: 0 !important;
    border-radius: 50% !important; background: linear-gradient(135deg, #0a1220, #14202f) !important;
    border: 1px solid var(--pb-accent) !important; color: var(--pb-accent) !important; cursor: pointer !important;
    display: grid !important; place-items: center !important;
    box-shadow: 0 0 10px rgba(34,211,238,.4), 0 2px 4px rgba(0,0,0,.4); transition: all .15s; font-family: inherit !important;
  }
  .pb-group-badge svg { width: 11px; height: 11px; }
  .pb-group-badge:hover { background: linear-gradient(135deg, var(--pb-accent), var(--pb-accent-3)) !important; color: #06121a !important; box-shadow: 0 0 16px rgba(34,211,238,.8), 0 2px 6px rgba(0,0,0,.5); transform: scale(1.1); }
  .pb-group-badge.danger { border-color: #f87171 !important; color: #f87171 !important; box-shadow: 0 0 10px rgba(248,113,113,.4), 0 2px 4px rgba(0,0,0,.4); }
  .pb-group-badge.danger:hover { background: linear-gradient(135deg, #f87171, #ef4444) !important; color: #fff !important; box-shadow: 0 0 16px rgba(248,113,113,.8); }

  /* popup */
  #popupMenu {
    position: fixed; display: none; padding: 14px;
    background: linear-gradient(135deg, rgba(6,10,20,.98), rgba(16,26,48,.98)) !important;
    border: 1px solid var(--pb-accent) !important; border-radius: 12px;
    flex-wrap: wrap; gap: 16px 14px; overflow-y: auto; z-index: 2147483000;
    box-shadow: 0 0 0 1px rgba(34,211,238,.12) inset, 0 0 30px rgba(34,211,238,.35), 0 0 80px rgba(168,85,247,.15), 0 12px 40px rgba(0,0,0,.65);
    backdrop-filter: blur(20px) saturate(1.5); -webkit-backdrop-filter: blur(20px) saturate(1.5);
    animation: pbPopIn .16s cubic-bezier(.34,1.3,.64,1);
  }
  #popupMenu::-webkit-scrollbar { width: 6px; }
  #popupMenu::-webkit-scrollbar-track { background: rgba(34,211,238,.05); border-radius: 3px; }
  #popupMenu::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--pb-accent), var(--pb-accent-2)); border-radius: 3px; }
  #popupMenu::before { content: ''; position: absolute; inset: 0; border-radius: 12px; pointer-events: none; background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(34,211,238,.015) 3px 4px); }
  @keyframes pbPopIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* 公式按钮 */
  .pb-fml-wrap { position: relative; display: inline-block; transition: transform .12s; }
  .pb-fml-wrap > .pb-fml-btn {
    padding: 5px 9px !important; min-width: 30px; min-height: 38px;
    display: flex !important; align-items: center !important; justify-content: center !important;
    background: linear-gradient(135deg, rgba(10,18,32,.94), rgba(16,26,48,.90)) !important;
    border: 1px solid rgba(34,211,238,.34) !important; border-radius: 8px !important;
    color: var(--pb-text) !important; font-family: inherit !important; cursor: pointer !important;
    transition: all .16s cubic-bezier(.34,1.2,.64,1); position: relative;
    box-shadow: 0 0 0 1px rgba(34,211,238,.06) inset, 0 1px 4px rgba(0,0,0,.35);
  }
  .pb-fml-wrap > .pb-fml-btn::before, .pb-fml-wrap > .pb-fml-btn::after {
    content: ''; position: absolute; width: 6px; height: 6px; border: 1.5px solid rgba(34,211,238,.55);
    pointer-events: none; transition: all .16s; z-index: 1;
  }
  .pb-fml-wrap > .pb-fml-btn::before { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
  .pb-fml-wrap > .pb-fml-btn::after { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
  .pb-fml-wrap > .pb-fml-btn:hover {
    background: linear-gradient(135deg, rgba(34,211,238,.16), rgba(168,85,247,.10)) !important;
    border-color: var(--pb-accent) !important; box-shadow: 0 0 0 1px rgba(34,211,238,.32) inset, 0 0 16px rgba(34,211,238,.5), 0 2px 10px rgba(0,0,0,.35); transform: translateY(-1px);
  }
  .pb-fml-wrap > .pb-fml-btn:hover::before, .pb-fml-wrap > .pb-fml-btn:hover::after { border-color: var(--pb-accent); width: 9px; height: 9px; filter: drop-shadow(0 0 4px rgba(34,211,238,.85)); }
  .pb-fml-wrap.in-manager > .pb-fml-btn { cursor: grab !important; border-style: dashed !important; border-color: rgba(34,211,238,.45) !important; background: linear-gradient(135deg, rgba(10,18,32,.78), rgba(16,26,48,.72)) !important; }
  .pb-fml-wrap.in-manager > .pb-fml-btn:hover { transform: none; box-shadow: 0 0 0 1px rgba(34,211,238,.10) inset, 0 0 8px rgba(34,211,238,.28); }
  .pb-fml-wrap.in-manager > .pb-fml-btn::before, .pb-fml-wrap.in-manager > .pb-fml-btn::after { border-color: rgba(34,211,238,.35); }
  .pb-fml-wrap.dragging { opacity: .3; transform: scale(.92); filter: grayscale(.6); outline: 1px dashed rgba(34,211,238,.5); outline-offset: 2px; }
  .pb-fml-wrap.is-hidden > .pb-fml-btn { opacity: .35; filter: grayscale(.9); }
  .pb-fml-wrap.drag-over-left, .pb-fml-wrap.drag-over-right { z-index: 20; }
  .pb-fml-wrap.drag-over-left > .pb-fml-btn, .pb-fml-wrap.drag-over-right > .pb-fml-btn {
    border-color: var(--pb-accent) !important; background: linear-gradient(135deg, rgba(34,211,238,.20), rgba(168,85,247,.14)) !important;
    box-shadow: 0 0 0 1px rgba(34,211,238,.45) inset, 0 0 16px rgba(34,211,238,.5) !important;
  }
  .pb-fml-wrap.drag-over-left::after, .pb-fml-wrap.drag-over-right::after {
    content: ''; position: absolute; top: -5px; bottom: -5px; width: 4px; border-radius: 3px;
    background: var(--pb-accent); box-shadow: 0 0 8px var(--pb-accent), 0 0 18px rgba(34,211,238,.9), 0 0 30px rgba(34,211,238,.5);
    pointer-events: none; z-index: 21; animation: pbDropPulse .75s ease-in-out infinite;
  }
  .pb-fml-wrap.drag-over-left::after { left: -7px; }
  .pb-fml-wrap.drag-over-right::after { right: -7px; }
  .pb-fml-badges { position: absolute; top: -7px; right: -7px; display: flex; gap: 2px; z-index: 4; }
  .pb-fml-badge {
    width: 16px !important; height: 16px !important; padding: 0 !important; margin: 0 !important;
    border-radius: 50% !important; background: linear-gradient(135deg, #0a1220, #14202f) !important;
    border: 1px solid var(--pb-accent) !important; color: var(--pb-accent) !important; cursor: pointer !important;
    display: grid !important; place-items: center !important;
    box-shadow: 0 0 8px rgba(34,211,238,.4), 0 1px 3px rgba(0,0,0,.4); transition: all .15s; font-family: inherit !important;
  }
  .pb-fml-badge svg { width: 8px; height: 8px; }
  .pb-fml-badge:hover { background: linear-gradient(135deg, var(--pb-accent), var(--pb-accent-3)) !important; color: #06121a !important; box-shadow: 0 0 12px rgba(34,211,238,.85); transform: scale(1.15); }
  .pb-fml-badge.danger { border-color: #f87171 !important; color: #f87171 !important; box-shadow: 0 0 8px rgba(248,113,113,.4), 0 1px 3px rgba(0,0,0,.4); }
  .pb-fml-badge.danger:hover { background: linear-gradient(135deg, #f87171, #ef4444) !important; color: #fff !important; box-shadow: 0 0 12px rgba(248,113,113,.85); }

  /* 弹窗 */
  .pb-modal-mask { position: fixed; inset: 0; background: rgba(2,6,14,.75); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 12px; }
  .pb-modal-mask.show { display: flex; }
  .pb-modal-card {

function genId() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }

let currentEngine = 'katex-inline'; // 新增

function renderFormula(latex, container) {
  const engine = currentEngine; // 改为读取变量
  if (engine === 'katex-inline') {
    katex.render(latex, container, { throwOnError: false, displayMode: false });
  } else if (engine === 'katex-display') {
    katex.render(latex, container, { throwOnError: false, displayMode: true });
  } else if (engine === 'mathjax-inline') {
    container.innerHTML = '$' + latex + '$';
    try { MathJax.typesetPromise([container]); } catch (e) {}
  } else if (engine === 'mathjax-display') {
    container.innerHTML = '$$' + latex + '$$';
    try { MathJax.typesetPromise([container]); } catch (e) {}
  }
}
/* =============================================================================
 *  3. 通信与数据保存/加载
 * ============================================================================= */
function pbPostMessage(type, data) {
  return new Promise((resolve, reject) => {
    const id = 'pb_' + (++pbMsgIdCounter) + '_' + Date.now();
    pbMsgPending.set(id, { resolve, reject });
    window.parent.postMessage({ type, data, id }, '*');
    setTimeout(() => {
      if (pbMsgPending.has(id)) {
        pbMsgPending.delete(id);
        reject(new Error('通信超时'));
      }
    }, 1500);
  });
}

function postFormulaToParent(text) {
  if (!text) return;
  window.parent.postMessage({ type: 'insert-formula', latex: text }, '*');
}

window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;

  if (d.type === 'pb:add-common-formula' && d.latex) {
    customData.customCommonFormulas = customData.customCommonFormulas || [];
    customData.customCommonFormulas.push({
      id: 'cc_' + genId(),
      latex: d.latex,
      insertText: d.latex
    });
    invalidateGroupCache();
    renderAllGroups();
    saveCustomData().then(() => {
      pbToast('已添加到常用：' + d.latex.slice(0, 18));
    });
  } else if (d.type === 'pb:add-formula-to-group' && d.gid && d.latex) {
    addFormulaToGroup(d.gid, d.latex).then(ok => {
      if (ok) pbToast('已添加到抽屉：' + d.latex.slice(0, 18));
    });
  }
  else if (d.type === 'pb:drag-start') {
    isDragging = true;
    hidePopup();
  }
  else if (d.type === 'pb:drag-move') {
    isDragging = true;
    if (_lastDragTarget) {
      _lastDragTarget.style.outline = '';
      _lastDragTarget.style.outlineOffset = '';
      _lastDragTarget.style.background = '';
      _lastDragTarget.style.boxShadow = '';
      _lastDragTarget = null;
    }

    if (!d.inFrame) return;

    const elem = document.elementFromPoint(d.x, d.y);
    if (!elem) return;

    let targetEl = null;
    const wrap = elem.closest('.pb-group-wrap');
    if (wrap) targetEl = wrap;
    else if (elem.closest('#commonButtons')) targetEl = document.getElementById('commonButtons');

    if (targetEl) {
      targetEl.style.outline = '3px dashed #22d3ee';
      targetEl.style.outlineOffset = '6px';
      targetEl.style.background = 'rgba(34,211,238,.25)';
      targetEl.style.boxShadow = '0 0 20px rgba(34,211,238,.8)';
      targetEl.style.borderRadius = '8px';
      targetEl.style.transition = 'all .2s';
      _lastDragTarget = targetEl;
    }
  }
  else if (d.type === 'pb:drag-end') {
    isDragging = false;

    if (_lastDragTarget) {
      _lastDragTarget.style.outline = '';
      _lastDragTarget.style.outlineOffset = '';
      _lastDragTarget.style.background = '';
      _lastDragTarget.style.boxShadow = '';
      _lastDragTarget = null;
    }

    if (!d.inFrame || !d.latex) return;

    const elem = document.elementFromPoint(d.x, d.y);
    if (!elem) return;

    const wrap = elem.closest('.pb-group-wrap');
    if (wrap && wrap.dataset.groupId) {
      const gid = wrap.dataset.groupId;
      addFormulaToGroup(gid, d.latex).then(ok => {
        if (ok) pbToast('已添加到抽屉：' + d.latex.slice(0, 18));
      });
      return;
    }

    const common = elem.closest('#commonButtons');
    if (common) {
      customData.customCommonFormulas = customData.customCommonFormulas || [];
      customData.customCommonFormulas.push({ id: 'cc_' + genId(), latex: d.latex, insertText: d.latex });
      invalidateGroupCache();
      renderAllGroups();
      saveCustomData().then(() => { pbToast('已添加到常用：' + d.latex.slice(0, 18)); });
    }
  }
});

function parseDataObject(parsed) {
  if (!parsed || typeof parsed !== 'object') return;
  customData = {
    version: parsed.version || 1,
    customGroups: Array.isArray(parsed.customGroups) ? parsed.customGroups : [],
    hiddenGroups: Array.isArray(parsed.hiddenGroups) ? parsed.hiddenGroups : [],
    hiddenFormulas: Array.isArray(parsed.hiddenFormulas) ? parsed.hiddenFormulas : [],
    groupOrder: Array.isArray(parsed.groupOrder) ? parsed.groupOrder : [],
    formulaOrder: (parsed.formulaOrder && typeof parsed.formulaOrder === 'object') ? parsed.formulaOrder : {},
    groupLevels: (parsed.groupLevels && typeof parsed.groupLevels === 'object') ? parsed.groupLevels : {},
    extraFormulas: (parsed.extraFormulas && typeof parsed.extraFormulas === 'object') ? parsed.extraFormulas : {},
    customCommonFormulas: Array.isArray(parsed.customCommonFormulas) ? parsed.customCommonFormulas : []
  };
}

async function loadCustomData() {
  try {
    const raw = localStorage.getItem('pb_custom_formulas');
    if (raw) { parseDataObject(JSON.parse(raw)); }
  } catch (e) {}

  try {
    const text = await pbPostMessage('pb:read-custom-formulas', {});
    if (text) {
      if (text !== localStorage.getItem('pb_custom_formulas')) {
        parseDataObject(JSON.parse(text));
        try { localStorage.setItem('pb_custom_formulas', text); } catch(e){}
        invalidateGroupCache();
        renderAllGroups();
      }
    }
  } catch (err) {
    console.warn('[pb] 无法读取主程序文件，已使用本地缓存数据');
  }
}
async function saveCustomData() {
  const text = JSON.stringify(customData, null, 2);
  try { localStorage.setItem('pb_custom_formulas', text); } catch(e) {}
  try {
    await pbPostMessage('pb:write-custom-formulas', { text });
    return true;
  } catch (err) {
    return false;
  }
}

    out.push({
      id: gid, source: 'template', key: k, level: getGroupLevel(gid),
      name: '', nameLatex: templates[k].icon, builtin: true, hidden: hiddenG.has(gid), formulas: [...base, ...ex]
    });
  }

  for (const k in groups) {
    const gid = 'grp:' + k;
    const base = groups[k].formulas.map((f, i) => ({
      id: gid + ':' + i, latex: f.latex, insertText: f.insertText, builtin: true, hidden: hiddenF.has(gid + ':' + i)
    }));
    const ex = (extras[gid] || []).map(f => ({
      id: f.id, latex: f.latex, insertText: f.insertText || f.latex, builtin: false, extra: true, hidden: hiddenF.has(f.id)
    }));
    out.push({
      id: gid, source: 'group', key: k, level: getGroupLevel(gid),
      name: '', nameLatex: groups[k].icon, builtin: true, hidden: hiddenG.has(gid), formulas: [...base, ...ex]
    });
  }

  for (const cg of (customData.customGroups || [])) {
    const gid = cg.id;
    const base = (cg.formulas || []).map(f => ({
      id: f.id, latex: f.latex, insertText: f.insertText || f.latex, builtin: false, hidden: hiddenF.has(f.id)
    }));
    const ex = (extras[gid] || []).map(f => ({
      id: f.id, latex: f.latex, insertText: f.insertText || f.latex, builtin: false, extra: true, hidden: hiddenF.has(f.id)
    }));
    out.push({
      id: gid, source: 'custom', level: getGroupLevel(gid),
      name: cg.name || '', nameLatex: cg.nameLatex || '', builtin: false, hidden: hiddenG.has(gid), formulas: [...base, ...ex]
    });
  }

  const commonFormulas = [];
  BUILTIN_COMMONS.forEach((f, i) => {
    const fid = 'common:' + i;
    commonFormulas.push({ id: fid, latex: f.latex, insertText: f.insertText, scale: f.scale, builtin: true, hidden: hiddenF.has(fid) });
  });
  (customData.customCommonFormulas || []).forEach(f => {
    commonFormulas.push({ id: f.id, latex: f.latex, insertText: f.insertText || f.latex, builtin: false, hidden: hiddenF.has(f.id) });
  });
  out.push({
    id: 'common', source: 'common', level: 3, name: '常用公式', nameLatex: '', builtin: true,
    hidden: hiddenG.has('common'), formulas: commonFormulas
  });

  const order = Array.isArray(customData.groupOrder) ? customData.groupOrder : [];
  const indexOf = id => { const i = order.indexOf(id); return i < 0 ? 999999 : i; };
  out.sort((a, b) => indexOf(a.id) - indexOf(b.id));

  allGroupsCache = out;
  return out;
}

function invalidateGroupCache() { allGroupsCache = null; }

function getGroupLevel(gid) {
  if (customData.groupLevels && customData.groupLevels[gid]) return customData.groupLevels[gid];
  if (gid === 'common') return 3;
  const cg = (customData.customGroups || []).find(g => g.id === gid);
  if (cg) return cg.level || 2;
  if (gid.startsWith('tpl:')) return 1;
  if (gid.startsWith('grp:')) return 2;
  return 2;
}

function setGroupLevel(gid, level) {
  if (!customData.groupLevels) customData.groupLevels = {};
  customData.groupLevels[gid] = level;
}

function setGroupHidden(gid, hidden) {
  const list = customData.hiddenGroups || (customData.hiddenGroups = []);
  const i = list.indexOf(gid);
  if (hidden && i < 0) list.push(gid);
  if (!hidden && i >= 0) list.splice(i, 1);
  invalidateGroupCache();
}

function setFormulaHidden(fid, hidden) {
  const list = customData.hiddenFormulas || (customData.hiddenFormulas = []);
  const i = list.indexOf(fid);
  if (hidden && i < 0) list.push(fid);
  if (!hidden && i >= 0) list.splice(i, 1);
  invalidateGroupCache();
}

function deleteCustomGroup(gid) {
  const cg = (customData.customGroups || []).find(g => g.id === gid);
  const fIds = cg ? (cg.formulas || []).map(f => f.id) : [];
  customData.customGroups = (customData.customGroups || []).filter(g => g.id !== gid);
  customData.hiddenGroups = (customData.hiddenGroups || []).filter(x => x !== gid);
  customData.hiddenFormulas = (customData.hiddenFormulas || []).filter(x => fIds.indexOf(x) < 0);
  customData.groupOrder = (customData.groupOrder || []).filter(x => x !== gid);
  if (customData.formulaOrder) delete customData.formulaOrder[gid];
  if (customData.extraFormulas) delete customData.extraFormulas[gid];
  if (customData.groupLevels) delete customData.groupLevels[gid];
  invalidateGroupCache();
}

function deleteFormulaFromGroup(gid, fid, f) {
  if (f && f.extra) {
    const list = (customData.extraFormulas || {})[gid];
    if (Array.isArray(list)) customData.extraFormulas[gid] = list.filter(x => x.id !== fid);
  } else {
    const cg = (customData.customGroups || []).find(x => x.id === gid);
    if (cg) cg.formulas = (cg.formulas || []).filter(x => x.id !== fid);
  }
  customData.hiddenFormulas = (customData.hiddenFormulas || []).filter(x => x !== fid);
  invalidateGroupCache();
}

async function addFormulaToGroup(gid, latex) {
  if (!latex || !latex.trim()) return false;
  latex = latex.trim();
  if (!customData.extraFormulas) customData.extraFormulas = {};
  if (!customData.extraFormulas[gid]) customData.extraFormulas[gid] = [];
  customData.extraFormulas[gid].push({ id: 'ex_' + genId(), latex: latex, insertText: latex });
  invalidateGroupCache();
  const ok = await saveCustomData();
  if (ok) {
    const popup = document.getElementById('popupMenu');
    if (popup && popup.style.display === 'flex') {
      const g = getAllGroups().find(x => x.id === gid);
      const anchor = document.querySelector('.pb-group-wrap[data-group-id="' + gid + '"]');
      if (g && anchor) showPopupForGroup(g, anchor);
    }
  }
  return ok;
}
function pbToast(msg, ms) {

    el = document.createElement('div');

}
async function resetAllOrder() {
  if (!confirm(
    '确定复原所有排序？\n\n' +
    '· 内置抽屉回到原始顺序\n' +
    '· 内置公式回到原始顺序\n' +
    '· 自定义抽屉、自定义公式排到最末尾\n' +
    '· 自定义抽屉的层级保持不变（你在哪层就还在哪层）\n' +
    '· 隐藏状态、自定义内容都不会被改动'
  )) return;

  // 1) 内置顺序：模板组 → 公式组 → 常用 → 自定义
  const order = [];
  for (const k in templates) order.push('tpl:' + k);
  for (const k in groups) order.push('grp:' + k);
  order.push('common');
  for (const cg of (customData.customGroups || [])) order.push(cg.id);

  customData.groupOrder = order;
  customData.formulaOrder = {};

  // ★ 关键：只清内置抽屉的层覆盖，保留自定义抽屉的层级
  const keptLevels = {};
  for (const cg of (customData.customGroups || [])) {
    // groupLevels 优先，没有就退回 cg.level（两者本应同步）
    let lv = null;
    if (customData.groupLevels && customData.groupLevels[cg.id]) {
      lv = customData.groupLevels[cg.id];
    } else if (cg.level) {
      lv = cg.level;
    }
    if (lv) {
      keptLevels[cg.id] = lv;
      // 顺手同步 cg.level，避免下次读取时不一致
      cg.level = lv;
    }
  }
  customData.groupLevels = keptLevels;

  invalidateGroupCache();
  await saveCustomData();
  hidePopup();
  renderAllGroups();

// 找到 resetAllOrder 末尾的这部分：
  const hint = document.getElementById('pbManagerHint');
  if (hint) {
    hint.textContent = '已复原';
    setTimeout(() => { 
      if (hint.textContent === '已复原') {
        hint.textContent = managerMode ? '排序模式' : '点击插入'; 
      }
    }, 1800);
  }
}

/* =============================================================================
 *  ★ 修复 1：setupGroupDrag
 *    · dragstart 直接 hidePopup()，避免首次拖动抽屉时浮窗挡住视野
 *    · drop 里先记录 isRight 再清高光（否则拖动排序方向永远判错）
 *    · drop 读取 latex 的优先级：text/plain → text/pb-formula 反查
 * ============================================================================= */
function setupGroupDrag(wrap, gid, container) {
  wrap.draggable = true;

  wrap.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/pb-group', gid);
    e.dataTransfer.effectAllowed = 'move';
    wrap.classList.add('dragging');
    hidePopup();                 // ★ 关键：立即隐藏，不等计时器
    window._pbDragGid = gid;
  });

  wrap.addEventListener('dragend', () => {
    wrap.classList.remove('dragging', 'drag-over-left', 'drag-over-right', 'drag-over-formula');
    document.querySelectorAll('.drag-over-left, .drag-over-right, .drag-over-formula').forEach(el => el.classList.remove('drag-over-left', 'drag-over-right', 'drag-over-formula'));
    window._pbDragGid = null;
    delayedHide();
  });

  wrap.addEventListener('dragover', (e) => {
    if (!e.dataTransfer) return;
    if (window._pbDragGid) {
      if (window._pbDragGid === gid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = wrap.getBoundingClientRect();
      wrap.classList.remove('drag-over-left', 'drag-over-right', 'drag-over-formula');
      if (e.clientX < rect.left + rect.width / 2) wrap.classList.add('drag-over-left');
      else wrap.classList.add('drag-over-right');
      return;
    }
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    wrap.classList.remove('drag-over-left', 'drag-over-right');
    wrap.classList.add('drag-over-formula');
  });

  wrap.addEventListener('dragleave', () => { wrap.classList.remove('drag-over-left', 'drag-over-right', 'drag-over-formula'); });

  wrap.addEventListener('drop', async (e) => {
    e.preventDefault();

    // ★ 关键：先读取左右方向，再清高光
    const isRight = wrap.classList.contains('drag-over-right');
    wrap.classList.remove('drag-over-left', 'drag-over-right', 'drag-over-formula');

    const srcGid = window._pbDragGid;
    if (srcGid) {
      if (srcGid === gid) return;
      await reorderGroup(srcGid, gid, isRight, container);
      return;
    }

    // ★ 关键：取 LaTeX 内容（优先 text/plain，兜底 text/pb-formula 反查）
    const dt = e.dataTransfer;
    if (!dt) return;

    let latex = (dt.getData('text/plain') || '').trim();
    if (!latex) {
      const fid = dt.getData('text/pb-formula');
      if (fid) {
        const all = getAllGroups();
        for (const gg of all) {
          const f = (gg.formulas || []).find(x => x.id === fid);
          if (f) { latex = (f.latex || '').trim(); break; }
        }
      }
    }
    if (!latex) return;

    const ok = await addFormulaToGroup(gid, latex);
    if (ok) {
      const g = getAllGroups().find(x => x.id === gid);
      pbToast('已添加到「' + (g ? (g.name || g.id) : gid) + '」：' + latex.slice(0, 18) + (latex.length > 18 ? '…' : ''));
    }
  });
}

async function reorderGroup(srcGid, dstGid, after, container) {
  const all = getAllGroups();
  const srcGroup = all.find(g => g.id === srcGid);
  const dstGroup = all.find(g => g.id === dstGid);
  if (!srcGroup || !dstGroup) return;

  if (srcGroup.level !== dstGroup.level && dstGroup.level !== 3) {
    setGroupLevel(srcGid, dstGroup.level);
    const cg = (customData.customGroups || []).find(x => x.id === srcGid);
    if (cg) cg.level = dstGroup.level;
  }

  let order = Array.isArray(customData.groupOrder) ? customData.groupOrder.slice() : [];
  all.forEach(g => { if (!order.includes(g.id)) order.push(g.id); });
  order = order.filter(id => id !== srcGid);
  const dstIdx = order.indexOf(dstGid);
  if (dstIdx < 0) return;
  const insertIdx = after ? dstIdx + 1 : dstIdx;
  order.splice(insertIdx, 0, srcGid);

  customData.groupOrder = order;
  invalidateGroupCache();
  hidePopup();
  renderAllGroups();
  await saveCustomData();
}

function applyFormulaOrder(g, list) {
  const ord = (customData.formulaOrder || {})[g.id];
  if (!Array.isArray(ord)) return list;
  const map = new Map(list.map(f => [f.id, f]));
  const result = [];
  ord.forEach(fid => { if (map.has(fid)) { result.push(map.get(fid)); map.delete(fid); } });
  list.forEach(f => { if (map.has(f.id)) result.push(f); });
  return result;
}

function showPopupForGroup(g, anchorEl) {
  cancelHide();
  const latest = getAllGroups().find(x => x.id === g.id);
  if (latest) g = latest;
  const popup = document.getElementById('popupMenu');
  if (!popup) return;

  popup.dataset.groupId = g.id;
  popup.innerHTML = '';
  const rawList = (g.formulas || []).filter(f => !f.hidden || showHiddenItems);
  const visible = applyFormulaOrder(g, rawList);

  if (!visible.length) {
    const empty = document.createElement('div');
    empty.textContent = '（该抽屉暂无可见公式）';
    empty.style.cssText = 'padding:20px;color:var(--pb-text-dim);font-size:13px;';
    popup.appendChild(empty);
  } else {
    visible.forEach(f => {
      const fwrap = document.createElement('div');
      fwrap.className = 'pb-fml-wrap';
      fwrap.dataset.formulaId = f.id;
      fwrap.dataset.latex = f.latex || '';     // ★ 修复 5：dragstart 需要用到真实 LaTeX
      if (managerMode) fwrap.classList.add('in-manager');
      if (f.hidden) fwrap.classList.add('is-hidden');

      const btn = document.createElement('button');
      btn.className = 'pb-fml-btn';
      const fc = document.createElement('div');
      btn.appendChild(fc);
      renderFormula(f.latex, fc);
      if (f.scale) { fc.style.transform = 'scale(' + f.scale + ')'; fc.style.transformOrigin = 'center center'; }
      btn.addEventListener('click', () => { if (!managerMode) { postFormulaToParent(f.insertText); hidePopup(); } });
      fwrap.appendChild(btn);

      if (managerMode) {
        const badges = document.createElement('div');
        badges.className = 'pb-fml-badges';

        const eye = document.createElement('button');
        eye.className = 'pb-fml-badge';
        eye.title = f.hidden ? '取消隐藏' : '隐藏公式';
        eye.innerHTML = f.hidden ? ICON_EYE_OFF : ICON_EYE;
        eye.addEventListener('click', (ev) => {
          ev.stopPropagation();
          setFormulaHidden(f.id, !f.hidden);
          showPopupForGroup(g, anchorEl);
          saveCustomData();
        });
        badges.appendChild(eye);

        if (!f.builtin) {
          const del = document.createElement('button');
          del.className = 'pb-fml-badge danger';
          del.title = '删除公式';
          del.innerHTML = ICON_X;
          del.addEventListener('click', async (ev) => {
            ev.stopPropagation();
            if (!confirm('确定删除这个公式？')) return;
            if (g.id === 'common') {
              customData.customCommonFormulas = (customData.customCommonFormulas || []).filter(x => x.id !== f.id);
              customData.hiddenFormulas = (customData.hiddenFormulas || []).filter(x => x !== f.id);
              invalidateGroupCache();
            } else {
              await deleteFormulaFromGroup(g.id, f.id, f);
            }
            showPopupForGroup(g, anchorEl);
            saveCustomData();
          });
          badges.appendChild(del);
        }
        fwrap.appendChild(badges);
        setupFormulaDrag(fwrap, g, anchorEl);
      }
      popup.appendChild(fwrap);
    });
  }

  popup.style.display = 'flex';
  popup.style.maxHeight = 'none';
  popup.style.maxWidth = (window.innerWidth - 24) + 'px';
  popup.style.left = '-9999px';
  popup.style.top = '0px';

  const rect = anchorEl.getBoundingClientRect();
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;
  const GAP = 8, MARGIN = 10;

  let left = rect.left;
  if (left + pw > window.innerWidth - MARGIN) left = rect.right - pw;
  if (left < MARGIN) left = MARGIN;

  const spaceBelow = window.innerHeight - rect.bottom - GAP - MARGIN;
  const spaceAbove = rect.top - GAP - MARGIN;
  let top;
  if (ph <= spaceBelow) { top = rect.bottom + GAP; }
  else if (ph <= spaceAbove) { top = rect.top - ph - GAP; }
  else if (spaceBelow >= spaceAbove) { top = rect.bottom + GAP; popup.style.maxHeight = spaceBelow + 'px'; }
  else { top = MARGIN; popup.style.maxHeight = spaceAbove + 'px'; }
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

/* =============================================================================
 *  ★ 修复 2：setupFormulaDrag
 *    dragstart 同时写入 text/plain（真实 LaTeX），
 *    保证拖到别的抽屉时 drop 端一定能拿到内容。
 * ============================================================================= */
function setupFormulaDrag(fwrap, g, anchorEl) {
  fwrap.draggable = true;

  fwrap.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/pb-formula', fwrap.dataset.formulaId);
    e.dataTransfer.setData('text/plain', fwrap.dataset.latex || '');
    e.dataTransfer.effectAllowed = 'copyMove';
    fwrap.classList.add('dragging');
    cancelHide();
    window._pbDragFml = { gid: g.id, fid: fwrap.dataset.formulaId };
  });

  fwrap.addEventListener('dragend', () => {
    fwrap.classList.remove('dragging');
    document.querySelectorAll('.pb-fml-wrap.drag-over-left, .pb-fml-wrap.drag-over-right').forEach(el => el.classList.remove('drag-over-left', 'drag-over-right'));
    window._pbDragFml = null;
    delayedHide();
  });

  fwrap.addEventListener('dragover', (e) => {
    const d = window._pbDragFml;
    if (!d || d.gid !== g.id || d.fid === fwrap.dataset.formulaId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = fwrap.getBoundingClientRect();
    fwrap.classList.remove('drag-over-left', 'drag-over-right');
    if (e.clientX < rect.left + rect.width / 2) fwrap.classList.add('drag-over-left');
    else fwrap.classList.add('drag-over-right');
  });

  fwrap.addEventListener('dragleave', () => { fwrap.classList.remove('drag-over-left', 'drag-over-right'); });

  fwrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    const d = window._pbDragFml;
    if (!d || d.gid !== g.id) return;
    const srcFid = d.fid;
    const dstFid = fwrap.dataset.formulaId;
    if (srcFid === dstFid) return;
    const isRight = fwrap.classList.contains('drag-over-right');
    fwrap.classList.remove('drag-over-left', 'drag-over-right');
    await reorderFormula(g, srcFid, dstFid, isRight, anchorEl);
  });
}

async function reorderFormula(g, srcFid, dstFid, after, anchorEl) {
  const popup = document.getElementById('popupMenu');
  if (!popup) return;
  const ids = [];
  popup.querySelectorAll('[data-formula-id]').forEach(el => ids.push(el.dataset.formulaId));
  const srcIdx = ids.indexOf(srcFid);
  const dstIdx = ids.indexOf(dstFid);
  if (srcIdx < 0 || dstIdx < 0) return;

  ids.splice(srcIdx, 1);
  let newDstIdx = ids.indexOf(dstFid);
  if (after) newDstIdx++;
  ids.splice(newDstIdx, 0, srcFid);

  if (!customData.formulaOrder) customData.formulaOrder = {};
  customData.formulaOrder[g.id] = ids;

  showPopupForGroup(g, anchorEl);
  await saveCustomData();
}

/* =============================================================================
 *  6. 渲染分组
 * ============================================================================= */


function renderAllGroups() {
  const tplCon = document.getElementById('templateGroupButtons');
  const grpCon = document.getElementById('groupButtons');
  const comCon = document.getElementById('commonButtons');
  if (!tplCon || !grpCon || !comCon) return;
  tplCon.innerHTML = '';
  grpCon.innerHTML = '';
  comCon.innerHTML = '';

  const all = getAllGroups();
  for (const g of all) {
    if (g.hidden && !showHiddenItems) continue;
    if (g.level === 1) renderGroupButton(g, tplCon);
    else if (g.level === 2) renderGroupButton(g, grpCon);
    else if (g.level === 3) renderCommonButtons(g, comCon);
  }

  tplCon.appendChild(createAddGroupBtn(1));
  grpCon.appendChild(createAddGroupBtn(2));
}

function createAddGroupBtn(level) {
  const btn = document.createElement('button');
  btn.className = 'pb-group-btn';
  btn.style.cssText += 'padding:6px 14px;font-size:12px;border:1px dashed var(--pb-accent) !important;color:var(--pb-accent) !important;background:transparent !important;';
  btn.textContent = '+ 新抽屉';
  btn.title = level === 1 ? '新建模板组（第一层）' : '新建公式组（第二层）';
  btn.addEventListener('click', () => openGroupEditor(null, level));
  return btn;
}

function renderCommonButtons(g, container) {
  const rawList = (g.formulas || []).filter(f => !f.hidden || showHiddenItems);
  const visible = applyFormulaOrder(g, rawList);

  if (!visible.length && !managerMode) {
    const empty = document.createElement('div');
    empty.textContent = '（暂无可用的常用公式）';
    empty.style.cssText = 'padding:8px;color:var(--pb-text-dim);font-size:12px;';
    container.appendChild(empty);
    return;
  }

  visible.forEach(f => {
    const fwrap = document.createElement('div');
    fwrap.className = 'pb-fml-wrap';
    fwrap.dataset.formulaId = f.id;
    fwrap.dataset.latex = f.latex || '';     // ★ 修复 5：dragstart 需要真实 LaTeX
    if (managerMode) fwrap.classList.add('in-manager');
    if (f.hidden) fwrap.classList.add('is-hidden');

    const btn = document.createElement('button');
    btn.className = 'pb-fml-btn';
    btn.style.minHeight = '34px';
    btn.style.minWidth = '34px';
    const fc = document.createElement('div');
    btn.appendChild(fc);
    renderFormula(f.latex, fc);
    if (f.scale) { fc.style.transform = 'scale(' + f.scale + ')'; fc.style.transformOrigin = 'center center'; }
    btn.addEventListener('click', () => { if (!managerMode) postFormulaToParent(f.insertText); });
    fwrap.appendChild(btn);

    if (managerMode) {
      const badges = document.createElement('div');
      badges.className = 'pb-fml-badges';

      const eye = document.createElement('button');
      eye.className = 'pb-fml-badge';
      eye.title = f.hidden ? '取消隐藏' : '隐藏公式';
      eye.innerHTML = f.hidden ? ICON_EYE_OFF : ICON_EYE;
      eye.addEventListener('click', (ev) => {
        ev.stopPropagation();
        setFormulaHidden(f.id, !f.hidden);
        renderAllGroups();
        saveCustomData();
      });
      badges.appendChild(eye);

      if (!f.builtin) {
        const del = document.createElement('button');
        del.className = 'pb-fml-badge danger';
        del.title = '删除公式';
        del.innerHTML = ICON_X;
        del.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          if (!confirm('确定删除这个公式？')) return;
          if (g.id === 'common') {
            customData.customCommonFormulas = (customData.customCommonFormulas || []).filter(x => x.id !== f.id);
            customData.hiddenFormulas = (customData.hiddenFormulas || []).filter(x => x !== f.id);
            invalidateGroupCache();
          } else {
            await deleteFormulaFromGroup(g.id, f.id, f);
          }
          renderAllGroups();
          saveCustomData();
        });
        badges.appendChild(del);
      }

      fwrap.appendChild(badges);
      setupCommonFormulaDrag(fwrap, g, container);
    }
    container.appendChild(fwrap);
  });

  if (managerMode) {
    const addBtn = document.createElement('button');
    addBtn.style.cssText = 'padding:0 16px;height:38px;border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;background:rgba(34,211,238,.04);border:1px dashed var(--pb-accent);color:var(--pb-accent);transition:.15s;display:inline-flex;align-items:center;gap:6px;';
    addBtn.innerHTML = '<span style="font-size:16px;line-height:1;">+</span> 添加公式';
    addBtn.title = '添加到常用公式';
    addBtn.addEventListener('mouseenter', () => { addBtn.style.background = 'rgba(34,211,238,.12)'; addBtn.style.boxShadow = '0 0 16px rgba(34,211,238,.32)'; });
    addBtn.addEventListener('mouseleave', () => { addBtn.style.background = 'rgba(34,211,238,.04)'; addBtn.style.boxShadow = 'none'; });
    addBtn.addEventListener('click', () => openAddCommonDialog());
    container.appendChild(addBtn);
  }
}

function setupCommonFormulaDrag(fwrap, g, container) {
  fwrap.draggable = true;
  fwrap.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/pb-formula', fwrap.dataset.formulaId);
    e.dataTransfer.setData('text/plain', fwrap.dataset.latex || '');
    e.dataTransfer.effectAllowed = 'copyMove';
    fwrap.classList.add('dragging');
    window._pbDragFml = { gid: g.id, fid: fwrap.dataset.formulaId };
  });
  fwrap.addEventListener('dragend', () => {
    fwrap.classList.remove('dragging');
    document.querySelectorAll('.pb-fml-wrap.drag-over-left, .pb-fml-wrap.drag-over-right').forEach(el => el.classList.remove('drag-over-left', 'drag-over-right'));
    window._pbDragFml = null;
  });
  fwrap.addEventListener('dragover', (e) => {
    const d = window._pbDragFml;
    if (!d || d.gid !== g.id || d.fid === fwrap.dataset.formulaId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = fwrap.getBoundingClientRect();
    fwrap.classList.remove('drag-over-left', 'drag-over-right');
    if (e.clientX < rect.left + rect.width / 2) fwrap.classList.add('drag-over-left');
    else fwrap.classList.add('drag-over-right');
  });
  fwrap.addEventListener('dragleave', () => { fwrap.classList.remove('drag-over-left', 'drag-over-right'); });
  fwrap.addEventListener('drop', async (e) => {
    e.preventDefault();
    const d = window._pbDragFml;
    if (!d || d.gid !== g.id) return;
    const srcFid = d.fid;
    const dstFid = fwrap.dataset.formulaId;
    if (srcFid === dstFid) return;
    const isRight = fwrap.classList.contains('drag-over-right');
    fwrap.classList.remove('drag-over-left', 'drag-over-right');
    const ids = [];
    container.querySelectorAll('[data-formula-id]').forEach(el => ids.push(el.dataset.formulaId));
    const srcIdx = ids.indexOf(srcFid);
    const dstIdx = ids.indexOf(dstFid);
    if (srcIdx < 0 || dstIdx < 0) return;
    ids.splice(srcIdx, 1);
    let newDstIdx = ids.indexOf(dstFid);
    if (isRight) newDstIdx++;
    ids.splice(newDstIdx, 0, srcFid);
    if (!customData.formulaOrder) customData.formulaOrder = {};
    customData.formulaOrder[g.id] = ids;
    renderAllGroups();
    await saveCustomData();
  });
}

function openAddCommonDialog() {
  const mask = document.getElementById('pbAddCommonMask');
  if (!mask) return;
  document.getElementById('pbAddCommonLatex').value = '';
  document.getElementById('pbAddCommonInsert').value = '';
  document.getElementById('pbAddCommonPreview').innerHTML = '<span style="color:var(--pb-text-dim);font-size:11.5px;font-style:italic;">（输入后显示预览）</span>';
  mask.classList.add('show');
  setTimeout(() => { document.getElementById('pbAddCommonLatex').focus(); }, 60);
}

function closeAddCommonDialog() {
  const mask = document.getElementById('pbAddCommonMask');
  if (mask) mask.classList.remove('show');
}

function updateAddCommonPreview() {
  const latex = document.getElementById('pbAddCommonLatex').value.trim();
  const prev = document.getElementById('pbAddCommonPreview');
  if (!prev) return;
  if (!latex) {
    prev.innerHTML = '<span style="color:var(--pb-text-dim);font-size:11.5px;font-style:italic;">（输入后显示预览）</span>';
    return;
  }
  try {
    prev.innerHTML = '';
    renderFormula(latex, prev);
  } catch (e) {
    prev.textContent = latex;
    prev.style.color = '#fca5a5';
  }
}

async function saveAddCommonFormula() {
  const latex = document.getElementById('pbAddCommonLatex').value.trim();
  const insert = document.getElementById('pbAddCommonInsert').value.trim();
  if (!latex) {
    document.getElementById('pbAddCommonLatex').focus();
    return;
  }
  customData.customCommonFormulas = customData.customCommonFormulas || [];
  customData.customCommonFormulas.push({ id: 'cc_' + genId(), latex: latex, insertText: insert || latex });
  invalidateGroupCache();
  closeAddCommonDialog();
  renderAllGroups();
  await saveCustomData();
}

/* =============================================================================
 *  ★ 修复 3：setupCommonDropZone
 *    · dragleave 用 contains(relatedTarget) 判断，避免进子元素时被误清
 *    · drop 里第一行就清高光，保证紫色虚线不会残留
 *    · drop 读 latex 的优先级：text/plain → text/pb-formula 反查
 * ============================================================================= */
function setupCommonDropZone() {
  const comCon = document.getElementById('commonButtons');
  if (!comCon || comCon._dropSetup) return;
  comCon._dropSetup = true;

  comCon.addEventListener('dragover', (e) => {
    if (!e.dataTransfer) return;
    if (window._pbDragGid) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    comCon.classList.add('drag-over-formula');
  });

  // ★ 关键：只有真正离开容器时才清除高光
  comCon.addEventListener('dragleave', (e) => {
    if (!comCon.contains(e.relatedTarget)) comCon.classList.remove('drag-over-formula');
  });

  comCon.addEventListener('drop', async (e) => {
    if (!e.dataTransfer) return;
    // ★ 关键：立刻清高光，无论后面走不走
    comCon.classList.remove('drag-over-formula');
    e.preventDefault();

    const dt = e.dataTransfer;
    let latex = (dt.getData('text/plain') || '').trim();
    if (!latex) {
      const fid = dt.getData('text/pb-formula');
      if (fid) {
        const all = getAllGroups();
        for (const gg of all) {
          const f = (gg.formulas || []).find(x => x.id === fid);
          if (f) { latex = (f.latex || '').trim(); break; }
        }
      }
    }
    if (!latex) return;

    customData.customCommonFormulas = customData.customCommonFormulas || [];
    customData.customCommonFormulas.push({ id: 'cc_' + genId(), latex: latex, insertText: latex });
    invalidateGroupCache();
    renderAllGroups();
    await saveCustomData();
    pbToast('已添加到常用：' + latex.slice(0, 18) + (latex.length > 18 ? '…' : ''));
  });
}

function initUI() {
  renderAllGroups();
  const popup = document.getElementById('popupMenu');
  if (popup) {
    popup.addEventListener('mouseenter', cancelHide);
    popup.addEventListener('mouseleave', delayedHide);
  }
  setupCommonDropZone();
}

// 替换掉原本的 initRender 函数
function setupEngineSwitcher() {
  const engineBtn = document.getElementById('pbEngineBtn');
  const engineMenu = document.getElementById('pbEngineMenu');
  const engineText = document.getElementById('pbEngineText');
  
  if (engineBtn && engineMenu && engineText) {
    engineBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      engineMenu.classList.toggle('show');
    });
    
    document.addEventListener('click', (e) => {
      if (!engineMenu.contains(e.target) && !engineBtn.contains(e.target)) {
        engineMenu.classList.remove('show');
      }
    });
    
    engineMenu.addEventListener('click', (e) => {
      const item = e.target.closest('.pb-popover-item');
      if (!item) return;
      currentEngine = item.dataset.val;
      engineMenu.querySelectorAll('.pb-popover-item').forEach(el => el.classList.toggle('active', el === item));
      
      if (currentEngine === 'katex-inline') engineText.textContent = 'Ki';
      else if (currentEngine === 'katex-display') engineText.textContent = 'Kd';
      else if (currentEngine === 'mathjax-inline') engineText.textContent = 'Mi';
      else if (currentEngine === 'mathjax-display') engineText.textContent = 'Md';
      
      engineMenu.classList.remove('show');
      hidePopup();
      renderAllGroups();
    });
  }
}

function setupManager() {
  const openBtn = document.getElementById('pbOpenManager');
  if (openBtn) openBtn.addEventListener('click', () => setManagerMode(!managerMode));

  const resetBtn = document.getElementById('pbResetOrder');
  if (resetBtn) resetBtn.addEventListener('click', resetAllOrder);

  // ★ 替换后的隐藏项按钮逻辑
  const hiddenBtn = document.getElementById('pbShowHiddenBtn');
  if (hiddenBtn) {
    try {
      showHiddenItems = localStorage.getItem(SHOW_HIDDEN_KEY) === '1';
    } catch (e) {}

    const updateHiddenBtn = () => {
      hiddenBtn.classList.toggle('active', showHiddenItems);
      hiddenBtn.querySelector('.icon-eye').style.display = showHiddenItems ? 'none' : 'block';
      hiddenBtn.querySelector('.icon-eye-off').style.display = showHiddenItems ? 'block' : 'none';
    };
    updateHiddenBtn();

    hiddenBtn.addEventListener('click', () => {
      showHiddenItems = !showHiddenItems;
      try { localStorage.setItem(SHOW_HIDDEN_KEY, showHiddenItems ? '1' : '0'); } catch (e) {}
      updateHiddenBtn();
      hidePopup();
      renderAllGroups();
    });
  }
  const mask = document.getElementById('pbAddCommonMask');
  if (mask) {
    document.getElementById('pbAddCommonClose').addEventListener('click', closeAddCommonDialog);
    document.getElementById('pbAddCommonCancel').addEventListener('click', closeAddCommonDialog);
    document.getElementById('pbAddCommonSave').addEventListener('click', saveAddCommonFormula);
    document.getElementById('pbAddCommonLatex').addEventListener('input', updateAddCommonPreview);
    document.getElementById('pbAddCommonLatex').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); document.getElementById('pbAddCommonInsert').focus(); }
    });
    document.getElementById('pbAddCommonInsert').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveAddCommonFormula(); }
    });
    mask.addEventListener('click', (e) => { if (e.target === mask) closeAddCommonDialog(); });
  }

  /* 编辑抽屉弹窗 */
  if (!document.getElementById('pbGroupEditorMask')) {
    const editMask = document.createElement('div');
    editMask.id = 'pbGroupEditorMask';
    editMask.className = 'pb-modal-mask';
    editMask.innerHTML =
      '<div class="pb-modal-card" style="max-width:560px;">' +
        '<div class="pb-modal-head">' +
          '<div class="pb-modal-title">EDIT DRAWER · 编辑抽屉</div>' +
          '<button class="pb-modal-close" id="pbGroupEditorClose">✕</button>' +
        '</div>' +
        '<div class="pb-modal-body">' +
          '<div style="margin-bottom:10px;">' +
            '<label class="pb-label">所属层级</label>' +
            '<select id="pbGroupEditorLevel" class="pb-select2">' +
              '<option value="1">第一层 · 模板组</option>' +
              '<option value="2">第二层 · 公式组</option>' +
            '</select>' +
          '</div>' +
          '<div style="margin-bottom:10px;">' +
            '<label class="pb-label">抽屉名称（纯文字）</label>' +
            '<input id="pbGroupEditorName" class="pb-input" type="text">' +
          '</div>' +
          '<div style="margin-bottom:10px;">' +
            '<label class="pb-label">图标 LaTeX（可选，留空则显示文字）</label>' +
            '<input id="pbGroupEditorNameLatex" class="pb-input" type="text" placeholder="\\text{力学}" style="font-family:ui-monospace,monospace;">' +
          '</div>' +
          '<div style="margin-bottom:14px;padding:8px 10px;background:rgba(34,211,238,.05);border:1px dashed var(--pb-border);border-radius:8px;font-size:12px;">' +
            '图标预览：<span id="pbGroupEditorPreview" style="display:inline-block;min-height:20px;"></span>' +
          '</div>' +
          '<div style="display:flex;align-items:center;margin-bottom:8px;">' +
            '<b style="font-size:13px;flex:1;">抽屉里的公式</b>' +
            '<button id="pbGroupEditorAddFormula" class="pb-btn" style="padding:4px 10px;font-size:12px;">+ 添加公式</button>' +
          '</div>' +
          '<div id="pbGroupEditorFormulas"></div>' +
        '</div>' +
        '<div style="padding:10px 14px;border-top:1px solid var(--pb-border);display:flex;gap:8px;justify-content:flex-end;">' +
          '<button id="pbGroupEditorCancel" class="pb-btn">取消</button>' +
          '<button id="pbGroupEditorSave" class="pb-btn primary">保存</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(editMask);

    const closeAll = () => { editMask.classList.remove('show'); };
    document.getElementById('pbGroupEditorClose').addEventListener('click', closeAll);
    document.getElementById('pbGroupEditorCancel').addEventListener('click', closeAll);

    document.getElementById('pbGroupEditorName').addEventListener('input', () => {
      currentEditingGroup.name = document.getElementById('pbGroupEditorName').value;
      updateGroupEditorPreview();
    });
    document.getElementById('pbGroupEditorNameLatex').addEventListener('input', () => {
      currentEditingGroup.nameLatex = document.getElementById('pbGroupEditorNameLatex').value;
      updateGroupEditorPreview();
    });
    document.getElementById('pbGroupEditorLevel').addEventListener('change', (e) => {
      currentEditingGroup.level = parseInt(e.target.value, 10);
    });
    document.getElementById('pbGroupEditorAddFormula').addEventListener('click', () => {
      currentEditingGroup.formulas = currentEditingGroup.formulas || [];
      currentEditingGroup.formulas.push({ id: 'cf_' + genId(), latex: '\\frac{a}{b}', insertText: '\\frac{}{}' });
      renderGroupEditor();
    });

    /* =============================================================================
     *  ★ 修复 4：保存抽屉时把 gid 塞进 groupOrder
     *    否则 customData.groupOrder 里没有这个 id，
     *    getAllGroups() 排序时 indexOf 返回 999999 → 永远排最后，
     *    看起来就像“没换位置”。
     * ============================================================================= */
    document.getElementById('pbGroupEditorSave').addEventListener('click', async () => {
      const g = currentEditingGroup;

      g.name = document.getElementById('pbGroupEditorName').value.trim() || '未命名';
      g.nameLatex = document.getElementById('pbGroupEditorNameLatex').value.trim();
      g.level = parseInt(document.getElementById('pbGroupEditorLevel').value, 10) || 2;
      setGroupLevel(g.id, g.level);

      const list = customData.customGroups || (customData.customGroups = []);
      const idx = list.findIndex(x => x.id === g.id);
      if (idx >= 0) list[idx] = g; else list.push(g);

      // ★ 关键：保证 groupOrder 里一定包含该 id（首次新建 / 换层时尤其重要）
      if (!Array.isArray(customData.groupOrder)) customData.groupOrder = [];
      if (!customData.groupOrder.includes(g.id)) {
        customData.groupOrder.push(g.id);
      }

      invalidateGroupCache();
      renderAllGroups();
      editMask.classList.remove('show');
      await saveCustomData();
    });
  }
}

function openGroupEditor(group, defaultLevel) {
  if (group) {
    currentEditingGroup = JSON.parse(JSON.stringify(group));
  } else {
    currentEditingGroup = { id: 'cg_' + genId(), name: '新抽屉', nameLatex: '', level: defaultLevel || 2, formulas: [] };
  }
  renderGroupEditor();
  const m = document.getElementById('pbGroupEditorMask');
  if (m) m.classList.add('show');
}

function renderGroupEditor() {
  const g = currentEditingGroup;
  if (!g) return;
  document.getElementById('pbGroupEditorName').value = g.name || '';
  document.getElementById('pbGroupEditorNameLatex').value = g.nameLatex || '';
  document.getElementById('pbGroupEditorLevel').value = String(g.level || 2);
  updateGroupEditorPreview();

  const box = document.getElementById('pbGroupEditorFormulas');
  box.innerHTML = '';
  if (!(g.formulas || []).length) {
    const empty = document.createElement('div');
    empty.textContent = '还没有公式，点上面「+ 添加公式」开始';
    empty.style.cssText = 'color:var(--pb-text-dim);font-size:12px;padding:12px;text-align:center;background:rgba(34,211,238,.03);border:1px dashed var(--pb-border);border-radius:8px;';
    box.appendChild(empty);
  } else {
    (g.formulas || []).forEach((f, i) => box.appendChild(renderFormulaEditorItem(f, i)));
  }
}

function updateGroupEditorPreview() {
  const nameLatex = (document.getElementById('pbGroupEditorNameLatex').value || '').trim();
  const name = (document.getElementById('pbGroupEditorName').value || '').trim();
  const prev = document.getElementById('pbGroupEditorPreview');
  if (!prev) return;
  if (nameLatex) {
    try { katex.render(nameLatex, prev, { throwOnError: false }); }
    catch (e) { prev.textContent = nameLatex; }
  } else {
    prev.textContent = name || '(无名称)';
  }
}

function renderFormulaEditorItem(f, i) {
  const item = document.createElement('div');
  item.style.cssText = 'padding:10px;margin-bottom:8px;border:1px solid var(--pb-border);border-radius:8px;background:rgba(34,211,238,.03);';

  function makeRow(labelText, inputEl) {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px;';
    const lb = document.createElement('label');
    lb.textContent = labelText;
    lb.style.cssText = 'font-size:12px;color:var(--pb-text-dim);width:36px;flex:none;';
    row.appendChild(lb);
    row.appendChild(inputEl);
    return row;
  }

  const latexInput = document.createElement('input');
  latexInput.className = 'pb-input';
  latexInput.value = f.latex || '';
  latexInput.style.cssText = 'flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:12px;';
  item.appendChild(makeRow('显示', latexInput));

  const insertInput = document.createElement('input');
  insertInput.className = 'pb-input';
  insertInput.value = f.insertText || '';
  insertInput.style.cssText = 'flex:1;min-width:0;font-family:ui-monospace,monospace;font-size:12px;';
  item.appendChild(makeRow('插入', insertInput));

  const prevRow = document.createElement('div');
  prevRow.style.cssText = 'display:flex;gap:6px;align-items:center;';
  const lb2 = document.createElement('label');
  lb2.textContent = '预览';
  lb2.style.cssText = 'font-size:12px;color:var(--pb-text-dim);width:36px;flex:none;';
  const prevBox = document.createElement('div');
  prevBox.style.cssText = 'flex:1;padding:6px 8px;background:rgba(10,18,32,.6);border-radius:6px;min-height:24px;overflow:auto;';
  const delBtn = document.createElement('button');
  delBtn.className = 'pb-btn danger';
  delBtn.textContent = '删除';
  delBtn.style.cssText = 'padding:4px 10px;font-size:12px;';
  prevRow.appendChild(lb2);
  prevRow.appendChild(prevBox);
  prevRow.appendChild(delBtn);
  item.appendChild(prevRow);

  const updatePreview = () => {
    try { katex.render(latexInput.value || '', prevBox, { throwOnError: false }); }
    catch (e) { prevBox.textContent = latexInput.value; }
  };
  updatePreview();

  latexInput.addEventListener('input', () => {
    currentEditingGroup.formulas[i].latex = latexInput.value;
    updatePreview();
  });
  insertInput.addEventListener('input', () => {
    currentEditingGroup.formulas[i].insertText = insertInput.value;
  });
  delBtn.addEventListener('click', () => {
    currentEditingGroup.formulas.splice(i, 1);
    renderGroupEditor();
  });

  return item;
}

/* =============================================================================
 *  9. 启动
 * ============================================================================= */
window.addEventListener('load', async () => {
  await loadCustomData();
  setupManager();
  initUI();
  setupEngineSwitcher(); // ★ 替换了原本的 initRender
});
</script>
